<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q-clock-AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f1a;
      color: #e4e4e7;
      width: 300px;
      min-height: 200px;
    }
    .header {
      padding: 16px;
      background: linear-gradient(135deg, rgba(167, 139, 250, 0.2), rgba(139, 92, 246, 0.1));
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #a78bfa;
    }
    .header p {
      font-size: 11px;
      color: #71717a;
      margin-top: 4px;
    }
    .section {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: #71717a;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
    }
    .toggle-label {
      font-size: 13px;
      color: #d4d4d8;
    }
    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .toggle.active {
      background: #a855f7;
    }
    .toggle-knob {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s ease;
    }
    .toggle.active .toggle-knob {
      transform: translateX(16px);
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.2);
      border-radius: 6px;
      font-size: 12px;
      color: #22c55e;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 4px rgba(34, 197, 94, 0.5);
    }
    .footer {
      padding: 12px 16px;
      font-size: 10px;
      color: #52525b;
      text-align: center;
    }
    .footer a {
      color: #a78bfa;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Q-clock-AI</h1>
    <p>AI reasoning booster & sandbox</p>
  </div>
  <div class="section">
    <div class="section-title">Status</div>
    <div class="status" id="status-indicator">
      <span class="status-dot"></span>
      <span id="status-text">Active</span>
    </div>
  </div>
  <div class="section">
    <div class="section-title">Features</div>
    <div class="toggle-row">
      <span class="toggle-label">Reasoning Boost</span>
      <div class="toggle active" id="toggle-boost"><div class="toggle-knob"></div></div>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">Sandbox</span>
      <div class="toggle active" id="toggle-sandbox"><div class="toggle-knob"></div></div>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">Native Bridge</span>
      <div class="toggle" id="toggle-native"><div class="toggle-knob"></div></div>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">Auto-run Safe</span>
      <div class="toggle" id="toggle-autorun"><div class="toggle-knob"></div></div>
    </div>
  </div>
  <div class="footer">
    Q-clock-AI v1.0.0 &bull; <a href="https://github.com/Q-clock-AI" target="_blank">GitHub</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
